# Initial HTTP endpoint while the first certificate is being issued.
# The authenticated portal is published only after TLS is ready.
server {
    listen 80;
    server_name bogdanova34.site bogdanova34.ru;
    server_tokens off;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
}
