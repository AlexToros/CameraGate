name: home-cameras
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: video_viewer
      POSTGRES_USER: viewer
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U viewer -d video_viewer']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://viewer@db:5432/video_viewer
      DB_PASSWORD_FILE: /run/secrets/db_password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      STREAM_GATEWAY: ${STREAM_GATEWAY:-http://host.docker.internal:8091}
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
    secrets: [db_password, gateway_token]
    volumes: [portal_data:/data]
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
  nginx:
    image: nginx:stable-alpine
    ports: ['127.0.0.1:8080:80']
    volumes: ['./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  portal_data:
secrets:
  db_password:
    file: .runtime/postgres-password
  gateway_token:
    file: .runtime/gateway.key
