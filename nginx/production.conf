map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name bogdanova34.ru;
    server_tokens off;
    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 308 https://bogdanova34.ru$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name bogdanova34.ru;
    server_tokens off;
    access_log off;
    client_max_body_size 256k;
    ssl_certificate /etc/letsencrypt/live/bogdanova34.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bogdanova34.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
